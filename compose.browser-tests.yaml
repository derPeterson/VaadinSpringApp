# Separate, disposable environment. The runner supplies a unique project name.
# !override requires Docker Compose 2.24.4 or newer.
services:
  app:
    extends:
      file: compose.yaml
      service: app
    image: ${BROWSER_TEST_APP_IMAGE:-vaadinspringapp-browser-tests-app:local}
    environment:
      APP_CFG_SERVICE_NAME: "VaadinSpringApp (Browser-Test)"
      APP_CFG_BASE_URL: "https://127.0.0.1:${BROWSER_TEST_APP_PORT:-18081}/"
      APP_HTTPS_ORIGIN: "https://127.0.0.1:${BROWSER_TEST_APP_PORT:-18081}"
      APP_SECURITY_EXPOSE_H2_CONSOLE: "false"
      APP_SECURITY_TOTP_ENCRYPTION_KEY: "${BROWSER_TEST_TOTP_KEY:?Use the isolated browser runner}"
      APP_SECURITY_DEVELOPMENT_OPTIONS_ENABLED: "${BROWSER_TEST_DEVELOPMENT_OPTIONS_ENABLED:-false}"
      APP_EXTERNAL_LOGIN_GOOGLE_CLIENT_ID: "${BROWSER_TEST_OIDC_GOOGLE_CLIENT:-}"
      APP_EXTERNAL_LOGIN_GOOGLE_CLIENT_SECRET: "${BROWSER_TEST_OIDC_GOOGLE_SECRET:-}"
      APP_EXTERNAL_LOGIN_GOOGLE_ENABLED: "${BROWSER_TEST_OIDC_GOOGLE_ENABLED:-false}"
      APP_EXTERNAL_LOGIN_GOOGLE_AUTHORIZATION_URI: "${BROWSER_TEST_OIDC_GOOGLE_AUTH:-}"
      APP_EXTERNAL_LOGIN_GOOGLE_TOKEN_URI: "${BROWSER_TEST_OIDC_GOOGLE_TOKEN:-}"
      APP_EXTERNAL_LOGIN_GOOGLE_JWK_SET_URI: "${BROWSER_TEST_OIDC_GOOGLE_KEYS:-}"
      APP_EXTERNAL_LOGIN_MICROSOFT_CLIENT_ID: "${BROWSER_TEST_OIDC_MICROSOFT_CLIENT:-}"
      APP_EXTERNAL_LOGIN_MICROSOFT_CLIENT_SECRET: "${BROWSER_TEST_OIDC_MICROSOFT_SECRET:-}"
      APP_EXTERNAL_LOGIN_MICROSOFT_ENABLED: "${BROWSER_TEST_OIDC_MICROSOFT_ENABLED:-false}"
      APP_EXTERNAL_LOGIN_MICROSOFT_AUTHORIZATION_URI: "${BROWSER_TEST_OIDC_MICROSOFT_AUTH:-}"
      APP_EXTERNAL_LOGIN_MICROSOFT_TOKEN_URI: "${BROWSER_TEST_OIDC_MICROSOFT_TOKEN:-}"
      APP_EXTERNAL_LOGIN_MICROSOFT_JWK_SET_URI: "${BROWSER_TEST_OIDC_MICROSOFT_KEYS:-}"
      # Invented accounts only in the disposable browser-test database.
      APP_BOOTSTRAP_ENABLED: "${BROWSER_TEST_BOOTSTRAP_ENABLED:-true}"
      APP_BOOTSTRAP_ADMINS_0_EMAIL: "browser-admin@example.test"
      APP_BOOTSTRAP_ADMINS_0_PASSWORD: "BrowserAdmin1!"
      APP_BOOTSTRAP_SUPERADMINS_0_EMAIL: "browser-superadmin@example.test"
      APP_BOOTSTRAP_SUPERADMINS_0_PASSWORD: "BrowserSuperadmin1!"

  proxy:
    extends:
      file: compose.yaml
      service: proxy
    ports: !override
      - "127.0.0.1:${BROWSER_TEST_APP_PORT:-18081}:443"
      - "127.0.0.1:${BROWSER_TEST_HTTP_PORT:-18082}:80"
    environment:
      APP_HTTPS_PORT: "${BROWSER_TEST_APP_PORT:-18081}"
      APP_TLS_CERT: /run/browser-tls/server.crt
      APP_TLS_KEY: /run/browser-tls/server.key
    volumes:
      - type: bind
        source: "${BROWSER_TEST_TLS_DIRECTORY:?Use browser-tests/run.ps1 with its own worker TLS directory}"
        target: /run/browser-tls
        read_only: true

  mailpit:
    extends:
      file: compose.yaml
      service: mailpit
    ports: !override
      - "127.0.0.1:${BROWSER_TEST_MAILPIT_PORT:-18026}:8025"

  # Zweites eigenes SMTP-Ziel ohne zusätzliche Hostports für den Neustartvertrag.
  mailpit-secondary:
    image: axllent/mailpit:v1.31.4
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  app-data:
  mailpit-data:
  proxy-data:
  proxy-config:
