# Container defaults; database and variable test settings come from compose.yaml.
spring.config.import=
server.port=8080
vaadin.productionMode=true
vaadin.launch-browser=false
app.security.expose-h2-console=${APP_SECURITY_EXPOSE_H2_CONSOLE:false}
spring.h2.console.enabled=${APP_SECURITY_EXPOSE_H2_CONSOLE:false}
spring.h2.console.settings.web-allow-others=${APP_SECURITY_EXPOSE_H2_CONSOLE:false}
app.config.defaults.service.name=${APP_CFG_SERVICE_NAME}
app.config.defaults.base.url=${APP_CFG_BASE_URL}

# Docker uses the compiled production frontend, not the development server.
vaadin.frontend.hotdeploy=false
