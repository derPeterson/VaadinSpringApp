# Local TLS terminates at Caddy. The custom native valve trusts only the configured proxy.
server.forward-headers-strategy=NONE
server.tomcat.redirect-context-root=false
server.address=${APP_HTTP_BIND_ADDRESS:127.0.0.1}
vaadin.launch-browser=false
app.https.origin=${APP_HTTPS_ORIGIN:https://localhost:8443}
app.https.proxy-host=${APP_HTTPS_PROXY_HOST:127.0.0.1}
app.config.defaults.base.url=${app.https.origin}/
