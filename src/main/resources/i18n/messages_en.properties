adminView.config.entry.mail_smtp_socketfactory_class.tooltip=Class name of a socket factory for SSL/TLS connections to the mail server.
adminView.config.entry.mail_debug.tooltip=Enables detailed mail transport logs. Changes take effect after a restart.
adminView.config.entry.email_queue_pool_size.tooltip=Number of threads in the application background thread pool. Read at application startup; changes take effect after a restart.
adminView.config.entry.email_queue_capacity.tooltip=Maximum number of due emails loaded per processing cycle. Does not limit the total number of stored queue entries. Also sets the task buffer size of the thread pool created at startup.
adminView.config.entry.email_queue_max_retry.tooltip=Number of additional send attempts after a confirmed failure before sending. 0 means no retries. An uncertain delivery outcome is not retried automatically.
adminView.config.entry.email_queue_sent_live_duration.tooltip=Retention period for queue entries marked as sent. Cleanup uses the creation date of the entry. The duration must be greater than zero.
