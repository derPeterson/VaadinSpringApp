adminView.config.entry.remember_me_duration.tooltip=Gültigkeitsdauer von Login speichern in Sekunden. Wird beim Anwendungsstart eingelesen; Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.remember_me_secret_key.tooltip=Sicherheitsschlüssel für die Remember-me-Authentifizierung. Wird beim Anwendungsstart eingelesen; Änderungen werden nach einem Neustart wirksam.
