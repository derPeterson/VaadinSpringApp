adminView.config.entry.login_attempts_limit.tooltip=Maximale Zahl erfolgloser Passwortanmeldungen pro Anmeldekennung innerhalb von 15 Minuten. Danach ist die Anmeldung für 15 Minuten gesperrt. Weitere Versuche verlängern die Sperre nicht. Änderungen gelten ab dem nächsten Versuch; bestehende Sperren laufen unverändert ab.
adminView.config.entry.max_sessions_per_user.tooltip=Maximale Zahl gleichzeitig angemeldeter Sitzungen je Benutzer. Mehrere Tabs im selben Browserprofil zählen normalerweise einmal. Weitere Anmeldungen werden abgewiesen; bestehende Sitzungen bleiben erhalten. Eine Änderung gilt für neue Anmeldungen ohne Neustart.
adminView.config.entry.maintenance_mode.tooltip=Sperrt die normale Nutzung ab dem nächsten Zugriff ohne Neustart. Administratoren und Superadministratoren behalten Zugang. Bestehende Sitzungen bleiben erhalten; Registrierung, Verifikation und Passwortreset pausieren. Hintergrundjobs laufen weiter.
adminView.config.entry.email_from.tooltip=Absenderadresse ausgehender E-Mails. Wird bei jedem Versand eingelesen.
adminView.config.entry.email_admin.tooltip=Empfängeradresse für Benachrichtigungen über endgültig fehlgeschlagene E-Mails der Warteschlange.
adminView.config.entry.verification_token_valid_duration.tooltip=Gültigkeitsdauer neu erzeugter Bestätigungslinks. Mindestdauer: {0} min. Eine Änderung passt das gespeicherte Ablaufdatum bestehender Tokens nicht an.
adminView.config.entry.verification_token_live_duration.tooltip=Aufbewahrungsfrist nach Ablauf eines Verifikationstokens. Mindestens {0} min. Die Frist verlängert nicht die Gültigkeit des Links; 0 bedeutet nicht unbegrenzt.
adminView.config.entry.password_reset_token_valid_duration.tooltip=Gültigkeitsdauer neu erzeugter Passwort-Reset-Links. Mindestdauer: {0} min. Eine Änderung passt das gespeicherte Ablaufdatum bestehender Tokens nicht an.
adminView.config.entry.password_reset_token_live_duration.tooltip=Aufbewahrungsfrist nach Ablauf eines Resettokens. Mindestens {0} min. Die Frist verlängert nicht die Gültigkeit des Links; 0 bedeutet nicht unbegrenzt.
adminView.config.entry.mail_host.tooltip=Hostname oder IP-Adresse des SMTP-Servers. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_port.tooltip=Port des SMTP-Servers, beispielsweise 25, 465 oder 587. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_username.tooltip=Benutzername für die Anmeldung am SMTP-Server. Kann bei Versand ohne SMTP-Authentifizierung leer bleiben. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_password.tooltip=Passwort für die Anmeldung am SMTP-Server. Kann bei Versand ohne SMTP-Authentifizierung leer bleiben. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_smtp_auth.tooltip=Aktiviert die Anmeldung am SMTP-Server mit Benutzername und Passwort. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_smtp_starttls_enable.tooltip=Aktiviert STARTTLS, sofern der SMTP-Server es unterstützt. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_smtp_ssl_enable.tooltip=Aktiviert eine direkte SSL/TLS-Verbindung zum SMTP-Server. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_smtp_ssl_trust.tooltip=Vertrauensliste für SSL/TLS-Verbindungen zum SMTP-Server. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.mail_debug.tooltip=Aktiviert ausführliche Protokolle des Mailversands. Änderungen werden nach einem Neustart wirksam.
adminView.config.entry.email_queue_pool_size.tooltip=Maximale Anzahl gleichzeitig bearbeiteter E-Mail-Versandaufgaben pro Anwendungsinstanz. Wird beim Anwendungsstart eingelesen; Änderungen werden nach einem Neustart wirksam. Begrenzt keine Mails pro Sekunde.
adminView.config.entry.email_queue_capacity.tooltip=Maximale Anzahl fälliger E-Mails, die pro Verarbeitungsdurchlauf ausgewählt werden. Wird vor jedem Durchlauf eingelesen. Begrenzt nicht die Gesamtzahl gespeicherter Warteschlangeneinträge.
adminView.config.entry.email_queue_max_retry.tooltip=Anzahl zusätzlicher Sendeversuche bei einem nachgewiesenen Fehler vor dem Versand. 0 bedeutet keine Wiederholung. Bei unklarem Versandstatus wird nicht automatisch erneut versendet.
adminView.config.entry.email_queue_sent_live_duration.tooltip=Aufbewahrungsdauer für als versendet markierte Warteschlangeneinträge. Die Bereinigung richtet sich nach dem Erstellungsdatum des Eintrags. Die Dauer muss größer als null sein.
