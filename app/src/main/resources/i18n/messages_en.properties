adminView.config.entry.mail_host.tooltip=Hostname or IP address of the SMTP server. Changes take effect after a restart.
adminView.config.entry.mail_port.tooltip=Port of the SMTP server, for example 25, 465 or 587. Changes take effect after a restart.
adminView.config.entry.mail_username.tooltip=Username for signing in to the SMTP server. May be empty when sending without SMTP authentication. Changes take effect after a restart.
adminView.config.entry.mail_password.tooltip=Password for signing in to the SMTP server. May be empty when sending without SMTP authentication. Changes take effect after a restart.
adminView.config.entry.mail_smtp_auth.tooltip=Enables sign-in to the SMTP server using a username and password. Changes take effect after a restart.
adminView.config.entry.mail_smtp_starttls_enable.tooltip=Enables STARTTLS when supported by the SMTP server. Changes take effect after a restart.
adminView.config.entry.mail_smtp_ssl_enable.tooltip=Enables a direct SSL/TLS connection to the SMTP server. Changes take effect after a restart.
adminView.config.entry.mail_smtp_ssl_trust.tooltip=Trust list for SSL/TLS connections to the SMTP server. Changes take effect after a restart.
adminView.config.entry.mail_debug.tooltip=Enables detailed mail transport logs. Changes take effect after a restart.
adminView.config.entry.email_queue_pool_size.tooltip=Maximum number of email delivery tasks processed concurrently per application instance. Read at application startup; changes take effect after a restart. Does not limit emails per second.
adminView.config.entry.email_queue_capacity.tooltip=Maximum number of due emails selected per processing cycle. Read before each cycle. Does not limit the total number of stored queue entries.
adminView.config.entry.email_queue_max_retry.tooltip=Number of additional send attempts after a confirmed failure before sending. 0 means no retries. An uncertain delivery outcome is not retried automatically.
adminView.config.entry.email_queue_sent_live_duration.tooltip=Retention period for queue entries marked as sent. Cleanup uses the creation date of the entry. The duration must be greater than zero.
