adminView.config.entry.service_name.tooltip=Display name of the application, for example in headers, account pages and email templates.
adminView.config.entry.base_url.tooltip=Public base address for newly generated verification and password-reset links in emails.\n\nDoes not change the address or port of the running server.
adminView.config.entry.remember_me_duration.tooltip=Validity period of remember-me login.\n\nRead at application startup. Changes take effect after a restart.
adminView.config.entry.remember_me_secret_key.tooltip=Security key for remember-me authentication.\n\nRead at application startup. Changes take effect after a restart.
adminView.config.entry.user_auto_absent_timeout.tooltip=Time without user activity before the user is automatically marked as absent.
adminView.config.entry.login_attempts_limit.tooltip=Maximum unsuccessful password sign-ins per sign-in identity within 15 minutes. Sign-in is then blocked for 15 minutes. Further attempts do not extend the block.\n\nChanges apply from the next attempt. Existing blocks retain their expiry.
adminView.config.entry.session_timeout_seconds.tooltip=An active session expires after this period without a request to the server.\n\nAfter a restart, this value applies to newly created sessions. Existing sessions keep their current timeout.
adminView.config.entry.max_sessions_per_user.tooltip=Maximum concurrent signed-in sessions per user. Multiple tabs in the same browser profile normally count once. Further sign-ins are rejected. Existing sessions remain active.\n\nChanges apply to new sign-ins without a restart.
adminView.config.entry.maintenance_mode.tooltip=Pauses normal use from the next request without a restart. Administrators and superadmins retain access. Existing sessions are preserved. Registration, verification and password reset are paused.\n\nBackground jobs continue.
adminView.config.entry.email_from.tooltip=Sender address for outgoing emails. Read for each send operation.
adminView.config.entry.email_admin.tooltip=Recipient address for notifications about emails that have finally failed in the queue.
adminView.config.entry.verification_token_valid_duration.tooltip=Validity period of newly generated verification links. Minimum: {0} min.\n\nChanging this setting does not change the stored expiry date of existing tokens.
adminView.config.entry.verification_token_live_duration.tooltip=Retention period after a verification token expires. Minimum {0} min. This does not extend link validity. A value of 0 does not mean unlimited.
adminView.config.entry.password_reset_token_valid_duration.tooltip=Validity period of newly generated password-reset links. Minimum: {0} min.\n\nChanging this setting does not change the stored expiry date of existing tokens.
adminView.config.entry.password_reset_token_live_duration.tooltip=Retention period after a reset token expires. Minimum {0} min. This does not extend link validity. A value of 0 does not mean unlimited.
adminView.config.entry.mail_host.tooltip=Hostname or IP address of the SMTP server.\n\nChanges take effect after a restart.
adminView.config.entry.mail_port.tooltip=Port of the SMTP server, for example 25, 465 or 587.\n\nChanges take effect after a restart.
adminView.config.entry.mail_username.tooltip=Username for signing in to the SMTP server. May be empty when sending without SMTP authentication.\n\nChanges take effect after a restart.
adminView.config.entry.mail_password.tooltip=Password for signing in to the SMTP server. May be empty when sending without SMTP authentication.\n\nChanges take effect after a restart.
adminView.config.entry.mail_smtp_auth.tooltip=Enables sign-in to the SMTP server using a username and password.\n\nChanges take effect after a restart.
adminView.config.entry.mail_smtp_starttls_enable.tooltip=Enables STARTTLS when supported by the SMTP server.\n\nChanges take effect after a restart.
adminView.config.entry.mail_smtp_ssl_enable.tooltip=Enables a direct SSL/TLS connection to the SMTP server.\n\nChanges take effect after a restart.
adminView.config.entry.mail_smtp_ssl_trust.tooltip=Trust list for SSL/TLS connections to the SMTP server.\n\nChanges take effect after a restart.
adminView.config.entry.mail_debug.tooltip=Enables detailed mail transport logs.\n\nChanges take effect after a restart.
adminView.config.entry.email_queue_pool_size.tooltip=Maximum number of email delivery tasks processed concurrently per application instance.\n\nRead at application startup. Changes take effect after a restart. Does not limit emails per second.
adminView.config.entry.email_queue_capacity.tooltip=Maximum number of due emails selected per processing cycle. Read before each cycle.\n\nDoes not limit the total number of stored queue entries.
adminView.config.entry.email_queue_max_retry.tooltip=Number of additional send attempts after a confirmed failure before sending. 0 means no retries. An uncertain delivery outcome is not retried automatically.
adminView.config.entry.email_queue_sent_live_duration.tooltip=Retention period for queue entries marked as sent. Cleanup uses the creation date of the entry. The duration must be greater than zero.
