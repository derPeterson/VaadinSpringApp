support.recoveryInstructions=Restore your authenticator\nSet up a new app using a recovery code.\n\nFind a recovery code\nLook for the emergency document you downloaded or your recovery codes saved in a password manager.\n\nStart recovery\nSign in with your portal password, Google or Microsoft. Before entering a code, choose \u201cRestore authenticator\u201d.\n\nConfirm the new app\nUse an unused recovery code and set up your new authenticator app. The recovery code is only used up after the replacement succeeds.\n\nSave your new recovery codes\nDownload the new codes and keep them somewhere safe, separate from your device.\n\nSecurity notice:\nNever send passwords, authenticator secrets or recovery codes.\n\nThis guide contains no new access codes. Without your authenticator or a valid recovery code, we cannot unlock your account.

