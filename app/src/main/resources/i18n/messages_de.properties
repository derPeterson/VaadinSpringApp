support.recoveryInstructions=Authenticator wiederherstellen\nSo richten Sie mit einem Ersatzcode eine neue App ein.\n\nErsatzcode bereitlegen\nSuchen Sie das heruntergeladene Notfalldokument oder Ihre gespeicherten Ersatzcodes im Passwortmanager.\n\nWiederherstellung starten\nMelden Sie sich mit Portalpasswort, Google oder Microsoft an. W\u00e4hlen Sie vor der Codeeingabe \u201eAuthenticator wiederherstellen\u201c.\n\nNeue App best\u00e4tigen\nVerwenden Sie einen unbenutzten Ersatzcode und richten Sie die neue Authenticator-App ein. Der Ersatzcode wird erst nach erfolgreichem Wechsel verbraucht.\n\nNeue Ersatzcodes sichern\nLaden Sie die neuen Codes herunter und bewahren Sie diese sicher und getrennt von Ihrem Ger\u00e4t auf.\n\nSicherheitshinweis:\nVersenden Sie niemals Passw\u00f6rter, Authenticator-Schl\u00fcssel oder Ersatzcodes.\n\nDiese Anleitung enth\u00e4lt keine neuen Zugangscodes. Ohne Authenticator oder g\u00fcltigen Ersatzcode k\u00f6nnen wir Ihr Konto nicht entsperren.

