adminView.config.effective_service_name=Der Name erscheint nach dem Speichern im Kopf dieser Adminseite. Andere Ansichten und die Fu\u00dfzeile \u00fcbernehmen ihn beim Neuaufbau, E-Mails und Dokumente bei ihrer Erstellung.
adminView.config.effective_copyright=Der Text gilt beim n\u00e4chsten Aufbau der Fu\u00dfzeile und f\u00fcr neu erstellte E-Mails. Bereits erzeugte E-Mails behalten ihren Text.
adminView.config.effective_base_url=Die Adresse gilt f\u00fcr neu erzeugte Links und die n\u00e4chste Anzeige der Anbieter-Callback-URL. Bereits erzeugte Links behalten ihre Adresse.
adminView.config.effective_restart_remembered=Nach dem Neustart k\u00f6nnen Sitzungen aus einer gespeicherten Anmeldung eine erneute Anmeldung ben\u00f6tigen.
adminView.config.effective_maintenance=Der Wartungsmodus gilt ab dem n\u00e4chsten Zugriff. Bestehende Sitzungen bleiben erhalten, Zugriffe ohne Adminrechte werden bei aktivem Wartungsmodus blockiert.
adminView.config.effective_auto_away=Der Wert gilt ab der n\u00e4chsten Aktivit\u00e4tspr\u00fcfung. Dabei z\u00e4hlt auch die bisherige Inaktivit\u00e4t in bestehenden Sitzungen.
adminView.config.effective_inbox_retention=Die Frist gilt ab der n\u00e4chsten Abfrage des Posteingangs oder Ungelesen-Z\u00e4hlers, auch f\u00fcr vorhandene Eintr\u00e4ge.
adminView.config.effective_history_retention=Die Frist gilt beim n\u00e4chsten Laden der Versandhistorie, auch f\u00fcr vorhandene Eintr\u00e4ge.
adminView.config.effective_cleanup_existing=Die n\u00e4chste planm\u00e4\u00dfige Bereinigung nutzt den neuen Wert auch f\u00fcr vorhandene Eintr\u00e4ge. Gel\u00f6schte Eintr\u00e4ge werden nicht wiederhergestellt.
adminView.config.effective_token_retention=Die n\u00e4chste Bereinigung ber\u00fccksichtigt die neue Aufbewahrungsfrist auch f\u00fcr bereits abgelaufene Codes. G\u00fcltige Links behalten ihr Ablaufdatum.
adminView.config.effective_mail_from=Die Adresse gilt ab dem n\u00e4chsten Versandversuch, auch f\u00fcr wartende E-Mails. Bereits gesendete E-Mails bleiben unver\u00e4ndert.
adminView.config.effective_mail_admin=Die Adresse gilt f\u00fcr die n\u00e4chste Benachrichtigung \u00fcber einen endg\u00fcltigen Versandfehler, auch bei bereits wartenden E-Mails.
adminView.config.effective_queue_current_batch=Der laufende Durchlauf beh\u00e4lt seine bisherigen Werte. Wartende E-Mails werden beim n\u00e4chsten Durchlauf nach dem neuen Wert verarbeitet.
adminView.config.effective_provider_client=Die Client-ID gilt f\u00fcr neue Vorg\u00e4nge mit diesem Anbieter, sobald der Anbieter aktiviert ist.
adminView.config.effective_provider_secret=Das Secret gilt f\u00fcr den n\u00e4chsten Codeaustausch eines neu gestarteten Vorgangs mit diesem Anbieter.
adminView.config.effective_provider_enabled=Der Schalter steuert ab dem Speichern, ob neue Vorg\u00e4nge mit diesem Anbieter gestartet werden k\u00f6nnen. Bereits ge\u00f6ffnete Anmeldeseiten aktualisieren die Anzeige beim Neuladen.
adminView.config.effective_provider_existing=Laufende Anbietervorg\u00e4nge m\u00fcssen nach einer \u00c4nderung neu gestartet werden. Bestehende Portalsitzungen bleiben erhalten.
adminView.config.effective_two_factor_rule=Die Regel greift bei der n\u00e4chsten Pr\u00fcfung dieser Aktion, auch in offenen Sitzungen.
adminView.config.effective_two_factor_inactivity_switch=Der Schalter greift beim n\u00e4chsten gesch\u00fctzten Zugriff, auch in offenen Sitzungen.
adminView.config.effective_two_factor_inactivity_duration=Bei aktiver Inaktivit\u00e4tsregel gilt die neue Frist beim n\u00e4chsten gesch\u00fctzten Zugriff, auch in offenen Sitzungen.
adminView.config.effective_two_factor_existing=Die \u00c4nderung macht bisherige 2FA-Nachweise und laufende Authenticator-Einrichtungen ung\u00fcltig. Betroffene Schritte m\u00fcssen erneut best\u00e4tigt oder gestartet werden.
