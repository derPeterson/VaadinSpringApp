server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]
app.security.expose-h2-console=${APP_SECURITY_EXPOSE_H2_CONSOLE:false}
app.security.totp-encryption-key=${APP_SECURITY_TOTP_ENCRYPTION_KEY:}
app.security.provider-secrets-encryption-key=${APP_SECURITY_PROVIDER_SECRETS_ENCRYPTION_KEY:}
app.security.development-options-enabled=${APP_SECURITY_DEVELOPMENT_OPTIONS_ENABLED:false}
spring.h2.console.enabled=${APP_SECURITY_EXPOSE_H2_CONSOLE:false}
spring.h2.console.path=/h2
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}
app.external-login.google.client-id=${APP_EXTERNAL_LOGIN_GOOGLE_CLIENT_ID:}
app.external-login.google.client-secret=${APP_EXTERNAL_LOGIN_GOOGLE_CLIENT_SECRET:}
app.external-login.google.enabled=${APP_EXTERNAL_LOGIN_GOOGLE_ENABLED:false}
app.external-login.microsoft.client-id=${APP_EXTERNAL_LOGIN_MICROSOFT_CLIENT_ID:}
app.external-login.microsoft.client-secret=${APP_EXTERNAL_LOGIN_MICROSOFT_CLIENT_SECRET:}
app.external-login.microsoft.enabled=${APP_EXTERNAL_LOGIN_MICROSOFT_ENABLED:false}
# General
app.config.defaults.service.name=${APP_CFG_SERVICE_NAME:{ServiceName}}
app.config.defaults.copyright.text=${APP_CFG_COPYRIGHT_TEXT:\u00A9 {year} {serviceName}}
app.config.defaults.base.url=${APP_CFG_BASE_URL:http://localhost:8080/}

# Security and sessions
app.config.defaults.rememberMe.duration=${APP_CFG_REMEMBER_ME_DURATION:1209600}
app.config.defaults.rememberMe.secret.key=${APP_CFG_REMEMBER_ME_SECRET_KEY:change-me-remember-me-secret}
app.config.defaults.login.attempts.limit=${APP_CFG_LOGIN_ATTEMPTS_LIMIT:10}
app.config.defaults.max.sessions.per.user=${APP_CFG_MAX_SESSIONS_PER_USER:3}
app.config.defaults.maintenance.mode=${APP_CFG_MAINTENANCE_MODE:false}

# Token validity and retention (ISO-8601 durations)
app.config.defaults.verificationToken.valid.duration=${APP_CFG_VERIFICATION_TOKEN_VALID_DURATION:PT24H}
app.config.defaults.verificationToken.live.duration=${APP_CFG_VERIFICATION_TOKEN_LIVE_DURATION:PT168H}
app.config.defaults.passwordResetToken.valid.duration=${APP_CFG_PASSWORD_RESET_TOKEN_VALID_DURATION:PT3H}
app.config.defaults.passwordResetToken.live.duration=${APP_CFG_PASSWORD_RESET_TOKEN_LIVE_DURATION:PT72H}

# Presence (ISO-8601 duration)
app.config.defaults.user.auto.absent.timeout=${APP_CFG_USER_AUTO_ABSENT_TIMEOUT:PT10M}

# Notifications (days)
app.config.defaults.user.notifications.inbox.retention.days=${APP_CFG_USER_NOTIFICATIONS_INBOX_RETENTION_DAYS:180}
app.config.defaults.user.notifications.history.retention.days=${APP_CFG_USER_NOTIFICATIONS_HISTORY_RETENTION_DAYS:365}

# Email sender
app.config.defaults.email.from=${APP_CFG_EMAIL_FROM:no-reply@example.com}
app.config.defaults.email.admin=${APP_CFG_EMAIL_ADMIN:admin@example.com}

# SMTP
app.config.defaults.mail.host=${APP_CFG_MAIL_HOST:localhost}
app.config.defaults.mail.port=${APP_CFG_MAIL_PORT:1025}
app.config.defaults.mail.username=${APP_CFG_MAIL_USERNAME:}
app.config.defaults.mail.password=${APP_CFG_MAIL_PASSWORD:}
app.config.defaults.mail.smtp.auth=${APP_CFG_MAIL_SMTP_AUTH:true}
app.config.defaults.mail.smtp.starttls.enable=${APP_CFG_MAIL_SMTP_STARTTLS_ENABLE:false}
app.config.defaults.mail.smtp.ssl.enable=${APP_CFG_MAIL_SMTP_SSL_ENABLE:false}
app.config.defaults.mail.smtp.ssl.trust=${APP_CFG_MAIL_SMTP_SSL_TRUST:*}
app.config.defaults.mail.debug=${APP_CFG_MAIL_DEBUG:false}

# Email queue
app.config.defaults.email.queue.pool.size=${APP_CFG_EMAIL_QUEUE_POOL_SIZE:5}
app.config.defaults.email.queue.capacity=${APP_CFG_EMAIL_QUEUE_CAPACITY:50}
app.config.defaults.email.queue.max_retry=${APP_CFG_EMAIL_QUEUE_MAX_RETRY:3}
app.config.defaults.email.queue.sent.live.duration=${APP_CFG_EMAIL_QUEUE_SENT_LIVE_DURATION:PT168H}

spring.datasource.url=jdbc:h2:file:./data/appdb;AUTO_SERVER=TRUE;MODE=MySQL;DB_CLOSE_DELAY=-1;SCHEMA=PUBLIC
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/application-schema-h2.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=PUBLIC
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.mustache.check-template-location=false
spring.task.scheduling.enabled=true
vaadin.launch-browser=true
logging.level.root=INFO
logging.level.de.derpeterson.app=INFO
# Geerbte Framework-Dumps auch bei DEBUG am Anwendungspaket ausgeschaltet lassen.
logging.level.de.derpeterson.app.security.AdmittedSecurityContextRepository=INFO
logging.level.de.derpeterson.app.security.DeviceRememberMeServices=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.atmosphere=INFO
logging.level.com.vaadin=INFO
logging.level.com.vaadin.flow=INFO
logging.level.org.springframework.boot.autoconfigure.orm.jpa=ERROR

# Development: serve current frontend styles instead of a precompiled dev bundle.
vaadin.frontend.hotdeploy=true
