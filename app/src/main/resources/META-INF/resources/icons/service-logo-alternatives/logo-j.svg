<svg fill="none" xmlns="http://www.w3.org/2000/svg" width="96" height="96" role="img" aria-label="Cosmos-Logo J &#x2013; Stitch-Vorschlag" viewBox="0 0 96 96">
          <defs>
            <!-- Korona-Glut Warmverlauf -->
            <linearGradient id="j-corona" x1="16" y1="12" x2="80" y2="84" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FDE047"/>
              <stop offset="35%" stop-color="#F97316"/>
              <stop offset="85%" stop-color="#DC2626"/>
              <stop offset="100%" stop-color="#7C2D12"/>
            </linearGradient>
            <!-- Planetentextur & Horizont-Abschattung -->
            <radialGradient id="j-planet" cx="38" cy="38" r="32" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1E293B"/>
              <stop offset="55%" stop-color="#0F172A"/>
              <stop offset="90%" stop-color="#050811"/>
              <stop offset="100%" stop-color="#020617"/>
            </radialGradient>
            <!-- Hintere Orbitbahn (hinter dem Planeten) -->
            <linearGradient id="j-orbit-back" x1="10" y1="58" x2="86" y2="38" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
            </linearGradient>
            <!-- Vordere Orbitbahn (vor dem Planeten, glühend) -->
            <linearGradient id="j-orbit-front" x1="18" y1="62" x2="82" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#38BDF8"/>
              <stop offset="80%" stop-color="#FDE047"/>
              <stop offset="100%" stop-color="#F97316"/>
            </linearGradient>
          </defs>

          <!-- 1. Hinterer Orbit (hinter dem Hauptkörper) -->
          <path d="M 12 56 C 14 36, 44 26, 78 34 C 84 35, 88 38, 88 41 C 88 43, 85 45, 80 47" stroke="url(#j-orbit-back)" stroke-width="4" stroke-linecap="round" fill="none"/>

          <!-- 2. Koronaler Lichtbogen (Atmosphärenrand / Eklipsenglühen) -->
          <circle cx="48" cy="48" r="30" stroke="url(#j-corona)" stroke-width="5" stroke-linecap="round" stroke-dasharray="140 60" transform="rotate(-65 48 48)"/>

          <!-- 3. Opaker Hauptkörper (Planetarer Globus mit Eigenschlagschatten) -->
          <circle cx="48" cy="48" r="25" fill="url(#j-planet)" stroke="#0E1726" stroke-width="1.5"/>

          <!-- 4. Feiner Atmosphärischer Horizont-Glanz auf der Kante -->
          <path d="M 28 32 A 25 25 0 0 1 68 28" stroke="#FEF08A" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

          <!-- 5. Vorderer Orbit (präzise Occlusion: schneidet über den Körper hinweg nach vorn) -->
          <path d="M 10 56 C 16 68, 52 74, 82 52 C 86 49, 88 45, 88 41" stroke="url(#j-orbit-front)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

          <!-- 6. Zudrängender Trabant / Lichtknoten auf der Vorderbahn -->
          <circle cx="70" cy="58" r="5" fill="#FDE047"/>
          <circle cx="70" cy="58" r="2.5" fill="#FFFFFF"/>
        </svg>
