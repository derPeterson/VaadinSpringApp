<svg fill="none" xmlns="http://www.w3.org/2000/svg" width="96" height="96" role="img" aria-label="Service-Logo" viewBox="0 0 96 96">
          <defs>
            <!-- Vertikaler Hauptstrahl (Nord-Süd) -->
            <linearGradient id="k-beam-v" x1="48" y1="6" x2="48" y2="90" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
              <stop offset="30%" stop-color="#38BDF8"/>
              <stop offset="50%" stop-color="#FFFFFF"/>
              <stop offset="70%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
            </linearGradient>
            <!-- Horizontaler Strahl (West-Ost) -->
            <linearGradient id="k-beam-h" x1="6" y1="48" x2="90" y2="48" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#818CF8" stop-opacity="0.1"/>
              <stop offset="30%" stop-color="#818CF8"/>
              <stop offset="50%" stop-color="#FFFFFF"/>
              <stop offset="70%" stop-color="#818CF8"/>
              <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
            </linearGradient>
            <!-- Gezeiten-Facetten (Violett zu Smaragd & Cyan) -->
            <linearGradient id="k-facet-1" x1="36" y1="20" x2="68" y2="52" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#C084FC"/>
              <stop offset="100%" stop-color="#6366F1"/>
            </linearGradient>
            <linearGradient id="k-facet-2" x1="52" y1="68" x2="20" y2="36" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#2DD4BF"/>
              <stop offset="100%" stop-color="#0284C7"/>
            </linearGradient>
            <!-- Äußerer Akkretions-Ring -->
            <radialGradient id="k-core" cx="48" cy="48" r="14" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="45%" stop-color="#67E8F9"/>
              <stop offset="85%" stop-color="#0284C7"/>
              <stop offset="100%" stop-color="#080E1B"/>
            </radialGradient>
          </defs>

          <!-- 1. Akkretions-Ellipse (Himmelsäquator / Plasma-Scheibe) -->
          <ellipse cx="48" cy="48" rx="38" ry="15" stroke="#A855F7" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" transform="rotate(-28 48 48)"/>

          <!-- 2. Dynamische Gezeiten-Schwingen (Zwei sich umschlingende Raumkrümmungen) -->
          <path d="M 48 14 C 62 26, 78 38, 82 48 C 66 48, 54 40, 48 14 Z" fill="url(#k-facet-1)"/>
          <path d="M 48 82 C 34 70, 18 58, 14 48 C 30 48, 42 56, 48 82 Z" fill="url(#k-facet-2)"/>

          <!-- 3. Vierstrahlige Pulsar-Nadeln (Schlanke astrophysikalische Jets) -->
          <!-- Vertikaler Jet -->
          <polygon points="48,8 51.5,42 48,48 44.5,42" fill="url(#k-beam-v)"/>
          <polygon points="48,88 51.5,54 48,48 44.5,54" fill="url(#k-beam-v)"/>
          <!-- Horizontaler Jet -->
          <polygon points="8,48 42,44.5 48,48 42,51.5" fill="url(#k-beam-h)"/>
          <polygon points="88,48 54,44.5 48,48 54,51.5" fill="url(#k-beam-h)"/>

          <!-- 4. Kompakte Singularität / Kristalliner Kern -->
          <circle cx="48" cy="48" r="10" fill="url(#k-core)"/>
          <circle cx="48" cy="48" r="4.5" fill="#FFFFFF"/>

          <!-- 5. Diagonale Mikro-Satellitenpunkte (Sternbegleiter) -->
          <circle cx="28" cy="28" r="2.2" fill="#FDE047"/>
          <circle cx="68" cy="68" r="2.2" fill="#22D3EE"/>
        </svg>
