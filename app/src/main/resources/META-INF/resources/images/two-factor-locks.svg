<svg viewBox="0 0 160 140" fill="none" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="blueLockGrad" x1="20" y1="30" x2="90" y2="130" gradientUnits="userSpaceOnUse">
              <stop stop-color="#00a3ff"/>
              <stop offset="1" stop-color="#0066aa"/>
            </linearGradient>
            <linearGradient id="cyanLockGrad" x1="70" y1="20" x2="140" y2="120" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38bdf8"/>
              <stop offset="1" stop-color="#0284c7"/>
            </linearGradient>
            <radialGradient id="shackleGleam" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 30) scale(40)">
              <stop stop-color="#ffffff" stop-opacity="0.8"/>
              <stop offset="1" stop-color="#94a3b8" stop-opacity="0.2"/>
            </radialGradient>
          </defs>

          <!-- Schaltung / Cosmos Signalbahnen im Hintergrund -->
          <path d="M10 70H40M120 70H150M25 45L45 60M135 45L115 60" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="10" cy="70" r="2" fill="#38bdf8" fill-opacity="0.4"/>
          <circle cx="150" cy="70" r="2" fill="#38bdf8" fill-opacity="0.4"/>

          <!-- Hinteres Schloss (Cyan/Türkis) -->
          <g transform="translate(68, 20)">
            <!-- Bügel -->
            <path d="M22 36V22C22 12 30 4 40 4C50 4 58 12 58 22V36" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
            <path d="M22 36V22C22 12 30 4 40 4C50 4 58 12 58 22V36" stroke="url(#shackleGleam)" stroke-width="7" stroke-linecap="round"/>
            <!-- Schlosskörper -->
            <rect x="10" y="34" width="60" height="54" rx="14" fill="url(#cyanLockGrad)"/>
            <rect x="11" y="35" width="58" height="52" rx="13" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
            <!-- Schlüsselloch -->
