            <rect x="8" y="34" width="64" height="56" rx="14" fill="url(#blueLockGrad)"/>
            <rect x="9.5" y="35.5" width="61" height="53" rx="12.5" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
            <!-- Highlight Gloss -->
            <path d="M16 42C20 38 32 38 38 38" stroke="rgba(255,255,255,0.5)" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Schlüsselloch -->
