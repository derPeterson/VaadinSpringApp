# Einheitlicher Python-Formatter; Version gemeinsam mit requirements-dev.txt aktualisieren.
required-version = "==0.17.1"
# Die Workflow-Skripte unterstützen laut ihrer Anleitung Python 3.10 und neuer.
target-version = "py310"
line-length = 88
indent-width = 4
preview = false
# Nur Python-Code, keine Notebooks, TOML- oder Markdown-Dateien formatieren.
include = ["*.py", "*.pyi"]
# Zusätzliche Schutzbereiche neben Ruffs Standardausschlüssen und .gitignore.
extend-exclude = ["target", "node_modules", "data", "logs", "runs", "generated"]
# Diese Ausschlüsse auch bei explizit übergebenen Dateipfaden beachten.
force-exclude = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
