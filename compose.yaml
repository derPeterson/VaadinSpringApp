name: vaadinspringapp-test

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: Europe/Berlin
      SPRING_PROFILES_ACTIVE: docker,https
      SPRING_CONFIG_IMPORT: ""
      # Local test settings. APP_CFG defaults initialize missing database entries only.
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/appdb;MODE=MySQL;DB_CLOSE_DELAY=-1;SCHEMA=PUBLIC"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      APP_CFG_SERVICE_NAME: "VaadinSpringApp (Docker-Test)"
      APP_CFG_BASE_URL: "https://127.0.0.1:18443/"
      APP_HTTPS_ORIGIN: "https://127.0.0.1:18443"
      APP_HTTPS_PROXY_HOST: proxy
      APP_HTTP_BIND_ADDRESS: "0.0.0.0"
      # Controls both application access and the H2 web console.
      APP_SECURITY_EXPOSE_H2_CONSOLE: "true"
      APP_BOOTSTRAP_ENABLED: "true"
      APP_BOOTSTRAP_ADMINS_0_EMAIL: admin@example.test
      APP_BOOTSTRAP_ADMINS_0_PASSWORD: "Password1!"
      APP_CFG_REMEMBER_ME_SECRET_KEY: local-docker-test-key-not-for-production
      APP_CFG_EMAIL_FROM: no-reply@example.test
      APP_CFG_EMAIL_ADMIN: admin@example.test
      APP_CFG_MAIL_HOST: mailpit
      APP_CFG_MAIL_PORT: "1025"
      APP_CFG_MAIL_USERNAME: ""
      APP_CFG_MAIL_PASSWORD: ""
      APP_CFG_MAIL_SMTP_AUTH: "false"
      APP_CFG_MAIL_SMTP_STARTTLS_ENABLE: "false"
      APP_CFG_MAIL_SMTP_SSL_ENABLE: "false"
    volumes:
      - app-data:/app/data
    depends_on:
      proxy:
        condition: service_healthy
        restart: true
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/internal/health"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 6
    stop_grace_period: 30s

  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "127.0.0.1:18443:443"
      - "127.0.0.1:18080:80"
    environment:
      APP_HTTPS_HOST: "127.0.0.1"
      APP_HTTPS_PORT: "18443"
    volumes:
      - ./docker/https/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy-data:/data
      - proxy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:18025:8025"
    environment:
      TZ: Europe/Berlin
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  mailpit-data:
  proxy-data:
  proxy-config:
