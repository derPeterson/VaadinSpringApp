<svg fill="none" xmlns="http://www.w3.org/2000/svg" width="96" height="96" role="img" aria-label="Cosmos-Logo L &#x2013; Stitch-Vorschlag" viewBox="0 0 96 96">
          <defs>
            <!-- Äußerer Spiralarm 1 (Magenta zu Rosa-Gold) -->
            <linearGradient id="l-arm-1" x1="16" y1="18" x2="84" y2="76" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#EC4899"/>
              <stop offset="50%" stop-color="#F43F5E"/>
              <stop offset="100%" stop-color="#F59E0B"/>
            </linearGradient>
            <!-- Innerer Spiralarm 2 (Ultramarin zu Cyan) -->
            <linearGradient id="l-arm-2" x1="80" y1="78" x2="16" y2="20" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#06B6D4"/>
              <stop offset="50%" stop-color="#3B82F6"/>
              <stop offset="100%" stop-color="#6366F1"/>
            </linearGradient>
            <!-- Dunkles galaktisches Zentrum -->
            <radialGradient id="l-core" cx="48" cy="48" r="16" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="35%" stop-color="#F472B6"/>
              <stop offset="70%" stop-color="#1E1B4B"/>
              <stop offset="100%" stop-color="#050811"/>
            </radialGradient>
          </defs>

          <!-- 1. Interstellarer Ringanker / Umlaufkreis -->
          <circle cx="48" cy="48" r="36" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5"/>

          <!-- 2. Spiralarm A (Oberer / Rechter Schwung) -->
          <path d="M 48 30 C 64 30, 80 40, 82 54 C 84 68, 72 80, 58 80 C 44 80, 36 72, 36 64 C 36 56, 44 50, 52 50 C 58 50, 62 54, 62 58" stroke="url(#l-arm-1)" stroke-width="5.5" stroke-linecap="round" fill="none"/>

          <!-- 3. Spiralarm B (Gegenläufiger unterer / Linker Schwung) -->
          <path d="M 48 66 C 32 66, 16 56, 14 42 C 12 28, 24 16, 38 16 C 52 16, 60 24, 60 32 C 60 40, 52 46, 44 46 C 38 46, 34 42, 34 38" stroke="url(#l-arm-2)" stroke-width="5.5" stroke-linecap="round" fill="none"/>

          <!-- 4. Galaktischer Kern (Zentrales Leuchtfeuer) -->
          <circle cx="48" cy="48" r="7" fill="url(#l-core)"/>
          <circle cx="48" cy="48" r="3" fill="#FFFFFF"/>

          <!-- 5. Sternenstaub-Partikel an den Armspitzen -->
          <circle cx="82" cy="54" r="2.5" fill="#FDE047"/>
          <circle cx="14" cy="42" r="2.5" fill="#67E8F9"/>
          <circle cx="48" cy="18" r="1.8" fill="#F43F5E"/>
          <circle cx="48" cy="78" r="1.8" fill="#38BDF8"/>
        </svg>
