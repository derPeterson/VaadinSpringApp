<svg width="96" height="96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cosmos-Logo M &#x2013; Stitch-Vorschlag" viewBox="0 0 96 96">
            <defs>
              <linearGradient id="gradM_corona" x1="16" y1="12" x2="80" y2="84" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FCD34D"/>
                <stop offset="30%" stop-color="#F59E0B"/>
                <stop offset="75%" stop-color="#EA580C"/>
                <stop offset="100%" stop-color="#B91C1C"/>
              </linearGradient>
              <linearGradient id="gradM_rim" x1="18" y1="18" x2="78" y2="78" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
              </linearGradient>
              <radialGradient id="gradM_core" cx="38" cy="38" r="42" gradientUnits="userSpaceOnUse">
                <stop offset="70%" stop-color="#080E1B"/>
                <stop offset="95%" stop-color="#0E1726"/>
                <stop offset="100%" stop-color="#1E293B"/>
              </radialGradient>
            </defs>
            <!-- Äußerer feiner Koronaring (Hintergrundglühen) -->
            <circle cx="48" cy="48" r="42" stroke="url(#gradM_rim)" stroke-width="1.5" stroke-dasharray="14 4 28 6"/>
            <!-- Dynamische Haupt-Koronasichel (starker warmer Energiebogen) -->
            <path d="M 48 6 A 42 42 0 1 1 6 48 A 34 34 0 1 0 48 6 Z" fill="url(#gradM_corona)"/>
            <!-- Vorschiebender opaker Himmelskörper (Eklipse-Zentrum) -->
            <circle cx="53" cy="53" r="33" fill="url(#gradM_core)"/>
            <circle cx="53" cy="53" r="33" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
            <!-- Baily-Perle / Koronaler Lichtfunke -->
            <circle cx="21" cy="21" r="5" fill="#FFFBEB"/>
            <circle cx="21" cy="21" r="2.5" fill="#F59E0B"/>
          </svg>
