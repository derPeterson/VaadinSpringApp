<!doctype html>

<html lang="de">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Angemeldetes Frontend · HTML und Vaadin im Vergleich</title>

<style>

@font-face{font-family:Inter;src:url(/custom-theme/fonts/InterVariable.ttf) format('truetype');font-weight:100 900}

*{box-sizing:border-box}body{margin:0;background:#050811;color:#e2e8f0;font:13px Inter,system-ui,sans-serif}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid #ffffff14;background:#0e1726;flex-wrap:wrap}

h1{margin:0;font-size:16px;font-weight:600}p{margin:5px 0 0;color:#94a3b8;font-size:12px}

.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}label{color:#94a3b8;font-size:12px}

select,button{font:inherit;color:#e2e8f0;background:#091120;border:1px solid #ffffff24;border-radius:8px;padding:8px 10px;cursor:pointer}button:hover,select:focus-visible{border-color:#38bdf8}

main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px;align-items:start}

section{min-width:0;border:1px solid #ffffff24;border-radius:10px;overflow:hidden;background:#05070e}

.caption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 14px;background:#080e1b;border-bottom:1px solid #ffffff14;font-weight:600}

.caption a{color:#38bdf8;font-size:11px;font-weight:400;text-decoration:none}.caption a:hover{text-decoration:underline}

.viewport{position:relative;margin:auto;overflow:hidden}iframe{display:block;border:0;transform-origin:top left;background:#05070e;max-width:none}

.measure{color:#38bdf8;font-size:11px;padding:9px 20px 0}

@media(max-width:600px){header{padding:12px}.controls{gap:6px}main{gap:8px;padding:8px}.caption{padding:9px;font-size:11px}.caption a{display:none}}

</style>

</head>

<body>

<header>

  <div><h1>Angemeldetes Frontend – direkter Vergleich</h1><p>Links HTML-Referenz, rechts die echte Vaadin-Anwendung. Beide Ansichten bleiben bedienbar.</p></div>

  <div class="controls">

    <label for="scene">Bereich</label><select id="scene"><option value="home">Startseite</option><option value="notifications">Benachrichtigungen</option><option value="profile" selected>Persönliche Daten</option><option value="security">Sicherheit · E-Mail und Passwort</option><option value="sessions">Geräte und Sitzungen</option></select>

    <label for="size">Bildschirm</label><select id="size"><option value="1280,900">Desktop · 1280 × 900</option><option value="1024,900">Desktop · 1024 × 900</option><option value="390,844">Smartphone · 390 × 844</option><option value="844,390">Smartphone quer · 844 × 390</option></select>

    <label for="zoom">Ansicht</label><select id="zoom"><option value="fit">Beide einpassen</option><option value="1">Originalgröße · 100 %</option></select>

    <button id="top" type="button">Beide nach oben</button>

  </div>

</header>

<div class="measure" id="measure"></div><p id="guide" style="padding:0 20px"></p>

<main>

  <section><div class="caption"><span>HTML-Referenz</span><a href="referenz.html" target="_blank" rel="noopener">Einzeln öffnen ↗</a></div><div class="viewport"><iframe title="Feste HTML-Referenz" src="referenz.html"></iframe></div></section>

  <section><div class="caption"><span>Echte Anwendung</span><a href="/account" target="_blank" rel="noopener">Einzeln öffnen ↗</a></div><div class="viewport"><iframe title="Echte Vaadin-Anwendung" src="/account"></iframe></div></section>

</main>

<script>

const scene=document.getElementById('scene');

const size=document.getElementById('size');

const zoom=document.getElementById('zoom');

const frames=[...document.querySelectorAll('iframe')];

const routes={home:'/home',notifications:'/notifications',profile:'/account?tab=profile',security:'/account?tab=security',sessions:'/account?tab=sessions'};

const guides={home:'Startseite und Schnellzugriffe. Das Benutzermenü, die Glockenvorschau und die mobile Navigation lassen sich auf beiden Seiten öffnen.',notifications:'Suche, Lesefilter und Pagination ausprobieren. Auge öffnet die Nachricht; Haken und Papierkorb öffnen die zugehörige Bestätigung. Beispieldaten links und rechts sind unabhängig.',profile:'Sprachauswahl, Geschlecht und Kalender öffnen. Profilbild bearbeiten öffnet den Bilddialog. Die echte Anwendung speichert ausschließlich in der eigenen flüchtigen Testdatenbank.',security:'E-Mail- und Passwortdialog auf beiden Seiten öffnen. Zum Vergleich leer bestätigen oder abbrechen; es wird keine E-Mail versendet und kein Passwort geändert.',sessions:'Aktive Sitzung, gespeicherte Anmeldung und Sammelaktion besitzen eigene Bestätigungen. Für den Vergleich abbrechen; die aktuelle Sitzung bleibt geschützt.'};

function showScene(){

 const value=scene.value;

 frames[0].src='referenz.html?rev=__REFERENCE_REVISION__&bereich='+value+'#'+value; frames[1].src=routes[value];

 document.querySelectorAll('.caption a')[0].href=frames[0].src;

 document.querySelectorAll('.caption a')[1].href=routes[value];

 document.getElementById('guide').textContent=guides[value];

 history.replaceState(null,'','#'+value);

}

scene.addEventListener('change',showScene);

const initial=location.hash.slice(1);if(routes[initial])scene.value=initial;

showScene();

function resize(){

  const [width,height]=size.value.split(',').map(Number);

  const available=Math.min(...[...document.querySelectorAll('section')].map(el=>el.clientWidth));

  const scale=zoom.value==='fit'?Math.min(1,available/width):1;

  document.querySelector('main').style.gridTemplateColumns=zoom.value==='fit'?'repeat(2,minmax(0,1fr))':`repeat(2,${width+2}px)`;

  frames.forEach(frame=>{

    frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`scale(${scale})`;

    frame.parentElement.style.width=width*scale+'px';frame.parentElement.style.height=height*scale+'px';

  });

  document.getElementById('measure').textContent=`Beide Oberflächen: ${width} × ${height} Pixel · Anzeige ${Math.round(scale*100)} %`;

}

size.addEventListener('change',resize);zoom.addEventListener('change',()=>{document.querySelector('main').style.gridTemplateColumns=zoom.value==='fit'?'repeat(2,minmax(0,1fr))':'repeat(2,max-content)';requestAnimationFrame(resize)});

window.addEventListener('resize',resize);

document.getElementById('top').addEventListener('click',()=>frames.forEach(frame=>{const doc=frame.contentDocument;if(doc)(doc.querySelector('vaadin-app-layout')?.shadowRoot?.querySelector('[part=content]') || doc.scrollingElement)?.scrollTo({top:0,behavior:'instant'});}));

resize();

</script>

</body></html>
