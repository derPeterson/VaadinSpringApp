<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmos · Benutzerverwaltung · Referenz</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-cosmos-viewer'; frame-src 'self' file:; base-uri 'none'; form-action 'none'">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#03050b;color:#e2e8f0;font:14px/1.5 system-ui,sans-serif}
    .preview-toolbar{padding:16px 22px;border-bottom:1px solid #26334b;background:#0b101e;display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
    .preview-title{margin:0;font-size:17px;font-weight:650}.preview-note{margin:0;color:#a7b5cb;font-size:12px}
    fieldset{border:0;padding:0;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}legend{float:left;margin-right:12px;color:#a7b5cb;font-size:12px}
    label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;min-height:32px}input{accent-color:#38bdf8}button{font:inherit}
    .preview-stage{padding:20px;overflow:auto}.preview-viewport{display:block;box-sizing:content-box;border:1px solid #26334b;border-radius:10px;background:#05070e;width:1440px;height:1000px;margin:0 auto}
    body[data-size="desktop"]{min-width:1482px}body[data-size="desktop"] .preview-stage{overflow:visible}
    body[data-size="phone"] .preview-viewport{width:390px;height:844px}
    body[data-size="landscape"] .preview-viewport{width:844px;height:390px}
    body[data-size="auto"] .preview-viewport{width:100%;max-width:1440px;height:calc(100dvh - 180px);min-height:650px}
    :focus-visible{outline:2px solid #38bdf8;outline-offset:3px}a{color:#7dd3fc}
    @media(max-width:600px){.preview-toolbar{padding:12px;gap:8px 20px}.preview-stage{padding:10px}body[data-size="auto"] .preview-viewport{min-height:700px}}
  </style>
<style>.preview-toolbar fieldset{margin-right:8px}.preview-toolbar label{cursor:pointer}body[data-size=auto] .preview-viewport{height:calc(100dvh - var(--preview-toolbar-height,180px) - 40px);min-height:360px}</style></head>
<body data-size="auto">
  <div class="preview-toolbar"><div style="width:100%"><h1 class="preview-title">Cosmos · Benutzerverwaltung</h1><p class="preview-note">Abgestimmte Frontend-Referenz mit synthetischen Daten. Alle Aktionen sind lokal simuliert.</p><p class="preview-note"><a href="index.html">Angemeldete Referenz</a> · <a href="visitors.html">Besucherreferenz</a> · <a href="admin.html" target="_blank" rel="noopener">Direktansicht</a></p></div><fieldset><legend>Ansicht</legend><label><input type="radio" name="size" value="auto" checked>Fensterbreite</label><label><input type="radio" name="size" value="desktop">Desktop</label><label><input type="radio" name="size" value="phone">Smartphone</label><label><input type="radio" name="size" value="landscape">Smartphone quer</label></fieldset></div>
  <div class="preview-stage"><iframe class="preview-viewport" id="account-preview" title="Benutzerverwaltung – feste Referenz" src="admin.html" sandbox="allow-scripts"></iframe></div>
  <script nonce="cosmos-viewer">(() => {
  const toolbar = document.querySelector('.preview-toolbar');
  new ResizeObserver(() => document.body.style.setProperty('--preview-toolbar-height',`${toolbar.getBoundingClientRect().height}px`)).observe(toolbar);
  document.querySelectorAll('[name=size]').forEach(input => input.addEventListener('change',() => { document.body.dataset.size = input.value; }));
})();</script>
</body>
</html>
