# Ausschließlich erfundene Beispiele. Eigene Zugangsdaten nur lokal hinterlegen.
app.bootstrap.enabled=true

# Je Liste bei Index 0 beginnen; weitere Konten mit [1], [2], ... ergänzen.
app.bootstrap.superadmins[0].email=admin@example.com
app.bootstrap.superadmins[0].password=NurFuerTests1!
app.bootstrap.superadmins[0].first-name=John
app.bootstrap.superadmins[0].last-name=Doe
app.bootstrap.superadmins[1].email=second-superadmin@example.test
app.bootstrap.superadmins[1].password=NurFuerTests2!

app.bootstrap.admins[0].email=administrator@example.test
app.bootstrap.admins[0].password=NurFuerTests3!
app.bootstrap.users[0].email=user@example.test
app.bootstrap.users[0].password=NurFuerTests4!
app.bootstrap.guests[0].email=guest@example.test
app.bootstrap.guests[0].password=NurFuerTests5!

# Optionale Profildaten pro Eintrag; Vorgaben: John, Doe, kein Geburtsdatum/Geschlecht, en.
app.bootstrap.guests[0].first-name=Jane
app.bootstrap.guests[0].last-name=Doe
app.bootstrap.guests[0].birth-date=1992-05-04
app.bootstrap.guests[0].gender=OTHER
app.bootstrap.guests[0].preferred-locale=de

# Pro Konto optional: true verlangt die Bestätigung der E-Mail-Adresse und verschickt
# die Bestätigungsmail bei der ersten Anlage. Standard false: direkt nutzbar, Nicht geprüft.
# Bestehende Konten werden beim Neustart nicht überschrieben oder erneut angeschrieben.
app.bootstrap.guests[0].email-verification-required=false
